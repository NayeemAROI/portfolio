name: Portfolio verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Regression and truth tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Static production build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://nayeemaroi.github.io/portfolio
      - name: Install CI-only browser harness (no manifest or lock changes)
        run: |
          npm install --no-save --package-lock=false --ignore-scripts @playwright/test@1.58.2
          npx playwright install --with-deps chromium
      - name: Browser acceptance
        run: node scripts/browser-smoke.mjs
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-browser-evidence
          path: browser-evidence/
          if-no-files-found: ignore
