name: Vendor skills

on:
  push:
    branches: ["skills/full-install"]
    paths: [".github/workflows/vendor-skills.yml"]

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vendor superpowers and ui-ux-pro-max
        run: |
          set -euxo pipefail
          SP_SHA="b36e0829c6d0140e93cfef2ca599b1b07d4a7797"
          UX_SHA="bc826e2267a36d98a2dcf5231e16c30ff546770f"

          git clone https://github.com/obra/superpowers.git /tmp/sp
          git -C /tmp/sp checkout "$SP_SHA"

          git clone https://github.com/nextlevelbuilder/ui-ux-pro-max-skill.git /tmp/ux
          git -C /tmp/ux checkout "$UX_SHA"

          if [ -f "/tmp/ux/.claude/skills/ui-ux-pro-max/SKILL.md" ]; then
            UXSRC="/tmp/ux/.claude/skills/ui-ux-pro-max"
          elif [ -f "/tmp/ux/src/ui-ux-pro-max/SKILL.md" ]; then
            UXSRC="/tmp/ux/src/ui-ux-pro-max"
          else
            echo "ui-ux-pro-max payload not found"
            exit 1
          fi

          for P in .claude/skills .agent/skills; do
            mkdir -p "$P"
            for d in /tmp/sp/skills/*/; do
              name="$(basename "$d")"
              rm -rf "${P:?}/$name"
              cp -R "$d" "$P/$name"
            done
            rm -rf "${P:?}/ui-ux-pro-max"
            cp -R "$UXSRC" "$P/ui-ux-pro-max"
          done

          find .claude .agent -type d -name "__pycache__" -prune -exec rm -rf {} \;
          find .claude/skills .agent/skills -mindepth 2 -type d -name ".git" -prune -exec rm -rf {} \;

      - name: Commit and self-remove
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/vendor-skills.yml
          git add -A .claude/skills .agent/skills
          git commit -m "chore: vendor superpowers (obra@b36e0829) + ui-ux-pro-max (nextlevelbuilder@bc826e22)"
          git push
